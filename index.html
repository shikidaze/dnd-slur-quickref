<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="仇恨之书">
<meta name="description" content="仇恨之书 · D&D 种族蔑称速查（跑团用离线速查页，334 条 / 25 个种族分组）">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>仇恨之书</title>
<style>
  :root{
    --bg:#12100e; --bg2:#1b1815; --card:#211d19; --card2:#2a251f;
    --line:#3a332b; --ink:#ece5da; --ink2:#a99f92; --ink3:#6f665c;
    --gold:#c8a15c; --gold2:#e0bd7c; --blood:#a2453c;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --r:14px;
    /* a codex, not an app: Chinese text is set in a serif (Songti / Noto Serif),
       Latin labels in an old-style serif with wide small-caps spacing */
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN",STSong,SimSun,"Times New Roman",serif;
    --latin:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #2a2118 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 10%, #1d2622 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font:16px/1.6 var(--serif);
    min-height:100vh; padding-bottom:calc(28px + var(--safe-b));
    overscroll-behavior-y:none;
  }
  /* every emoji badge is pressed into a monochrome bronze stamp so the icons stop
     fighting the woodcut artwork */
  .ic,.chip .ic,.d20+.brand-ico{filter:grayscale(1) sepia(.62) saturate(1.7) brightness(1.06) contrast(1.05)}
  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    padding:calc(10px + var(--safe-t)) 14px 10px;
    background:linear-gradient(180deg,rgba(18,16,14,.97) 70%,rgba(18,16,14,.82));
    backdrop-filter:blur(12px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .d20{
    width:36px;height:36px;flex:0 0 36px;border-radius:10px;object-fit:cover;
    border:1px solid rgba(200,161,92,.35);
    box-shadow:0 3px 12px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.6) inset;
  }
  .brand h1{font-size:17.5px;margin:0;font-weight:700;letter-spacing:.06em;font-family:var(--serif)}
  .brand .sub{font-size:10.5px;color:var(--ink3);margin-top:2px;letter-spacing:.14em;
    font-family:var(--latin);text-transform:uppercase}
  .searchbox{position:relative}
  .searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  #q{
    width:100%;padding:11px 40px 11px 38px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);color:var(--ink);
    font-size:16px;outline:none;transition:border-color .15s,background .15s;
  }
  #q:focus{border-color:var(--gold);background:var(--card2)}
  #q::placeholder{color:var(--ink3)}
  #clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border:0;border-radius:50%;background:transparent;
    color:var(--ink3);font-size:18px;display:none;cursor:pointer;
  }
  #clear.on{display:block}
  /* ---------- chips ---------- */
  #chips{
    display:flex;gap:8px;overflow-x:auto;padding:10px 14px 2px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  #chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:13px;white-space:nowrap;cursor:pointer;
    transition:.15s;
  }
  .chip.on{background:linear-gradient(145deg,var(--gold2),#a8813f);color:#1a1510;border-color:transparent;font-weight:600}
  /* ---------- list ---------- */
  main{padding:12px 14px 0}
  /* a race group: the illustration is the background of the WHOLE column, darkened
     top-to-bottom so the title and the entry cards stay readable on top of it */
  .group{
    position:relative;margin:0 0 16px;padding:12px 12px 14px;border-radius:var(--r);
    border:1px solid var(--line);overflow:hidden;scroll-margin-top:130px;
    /* The column's own background is a gradient (lighter at the top, black at the
       bottom): a dark inset shadow is invisible on a flat near-black column, so the
       bottom fade needs something to fade FROM. */
    background:linear-gradient(180deg,#231e18 0%,#1c1713 55%,#12100e 100%);
    border-bottom-color:rgba(200,161,92,.24);
    box-shadow:0 -72px 84px -34px rgba(0,0,0,1) inset,
               0 -1px 0 0 rgba(200,161,92,.2) inset;
  }
  /* The illustration is the column's background: a real <img> so the browser sizes
     it for us (no aspect maths), with a 24 px stand-in underneath for instant paint
     and a mask that dissolves the bottom of the picture into the dark column. */
  .gart{position:absolute;left:0;right:0;top:0;overflow:hidden;pointer-events:none;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 70%,rgba(0,0,0,.45) 88%,rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(180deg,#000 0%,#000 70%,rgba(0,0,0,.45) 88%,rgba(0,0,0,0) 100%);}
  .gart img{display:block;width:100%;height:auto}
  .gart .full{position:absolute;inset:0;height:100%;object-fit:cover;object-position:center 26%;
    opacity:0;filter:brightness(1.1) contrast(.94) saturate(.9);
    transition:opacity .5s ease, filter .7s ease}
  .gart .full.on{opacity:1;filter:none}
  /* fill mode: the column is shorter than the picture, so keep the picture at its
     natural scale (no zoom, nothing cut off at the sides) and slide it up/down so
     the face lands in the middle of the column */
  .group.art-fill .gart{height:100%}
  .group.art-fill .gart img{height:100%;object-fit:cover;object-position:center 26%}
  .group.art-top .gart{height:auto}
  /* top mode: the column is much taller than the picture, so the picture sits at
     full width on top and the column's own gradient darkens the rest */
  .group.art-top .gart img{height:auto}
  .group.art-on::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(18,16,14,.30) 0px,
      rgba(18,16,14,.46) 200px,
      rgba(18,16,14,.66) 420px,
      rgba(18,16,14,.86) calc(100% - 150px),
      rgba(18,16,14,1) 100%);
  }
  .group>*{position:relative;z-index:1}
  /* a chapter heading, the way a printed book opens a race: rules on both sides,
     the Chinese name in the middle, the Latin name and the count beneath it */
  .ghead{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    /* negative top margin pulls the header's dark backdrop up over the column's own
       padding, so the shading reaches the very top edge instead of leaving a strip */
    margin:-12px -12px 10px;padding:15px 12px 10px;position:relative;
    background:linear-gradient(180deg,rgba(18,16,14,.82) 0%,rgba(18,16,14,.5) 62%,rgba(18,16,14,0) 100%);
  }
  .ghead .row{display:flex;align-items:center;gap:9px;width:100%}
  .ghead .row::before,.ghead .row::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(200,161,92,.42),transparent);
  }
  .ghead .ic{font-size:16px;line-height:1}
  .ghead .zh{font-size:17px;font-weight:700;letter-spacing:.14em;text-shadow:0 1px 6px rgba(0,0,0,.85);white-space:nowrap}
  .ghead .meta{font-size:10.5px;color:var(--gold2);letter-spacing:.16em;text-transform:uppercase;
    font-family:var(--latin);text-shadow:0 1px 6px rgba(0,0,0,.85)}
  .ghead .meta b{color:var(--ink2);font-weight:400;letter-spacing:.08em}
  /* the ornament that closes a chapter */
  .fleuron{
    text-align:center;color:rgba(200,161,92,.5);font-size:14px;line-height:1;
    margin:2px 0 18px;letter-spacing:.6em;text-indent:.6em;
  }
  /* "you are here" label while scrolling a very long list */
  #nowbar{
    position:fixed;left:50%;transform:translate(-50%,-140%);top:calc(var(--safe-t) + 96px);
    z-index:35;padding:3px 12px;border-radius:999px;white-space:nowrap;
    background:rgba(24,20,17,.9);border:1px solid rgba(200,161,92,.3);
    color:var(--gold2);font-size:12px;letter-spacing:.1em;
    box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .25s,opacity .25s;opacity:0;
  }
  #nowbar.on{transform:translate(-50%,0);opacity:1}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  /* back to top (334 entries is a long scroll) */
  #top{
    position:fixed;right:14px;bottom:calc(18px + var(--safe-b));z-index:40;
    width:40px;height:40px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(200,161,92,.4);color:var(--gold2);font-size:17px;
    background:rgba(33,29,25,.86);backdrop-filter:blur(6px);
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    opacity:0;transform:translateY(12px);pointer-events:none;transition:.22s;
  }
  #top.on{opacity:1;transform:none;pointer-events:auto}
  li{
    display:flex;align-items:center;gap:10px;position:relative;
    background:rgba(30,26,22,.74);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 12px 10px 15px;transition:.14s;
  }
  /* a thin gold index ribbon down the left edge of every entry, like a bookmark */
  li::before{
    content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:0 2px 2px 0;
    background:linear-gradient(180deg,rgba(200,161,92,.55),rgba(200,161,92,.1));
  }
  li:active{background:rgba(42,37,31,.86);transform:scale(.995)}
  .txt{min-width:0;flex:1}
  .zh{font-size:16.5px;font-weight:600;letter-spacing:.02em;word-break:break-word;font-family:var(--serif)}
  .en{font-size:12.5px;color:var(--gold);margin-top:3px;letter-spacing:.02em;
      font-family:var(--mono);word-break:break-word}
  /* "who uses it" reads as an ink-grey stamp (no red: it competed with the gold) */
  .sub{display:inline-block;margin-top:6px;font-size:10.5px;color:#cfc6b8;
       border:1px solid rgba(168,159,144,.3);border-radius:999px;padding:1px 9px;
       background:linear-gradient(180deg,rgba(60,55,48,.92),rgba(32,29,26,.94));
       box-shadow:0 1px 0 rgba(0,0,0,.4) inset;letter-spacing:.04em}
  .star{
    flex:0 0 30px;width:30px;height:30px;border:0;border-radius:9px;background:transparent;
    color:var(--ink3);font-size:16px;cursor:pointer;display:grid;place-items:center;
  }
  .star.on{color:var(--gold2)}
  mark{background:rgba(200,161,92,.32);color:var(--gold2);border-radius:3px;padding:0 1px}
  /* ---------- misc ---------- */
  .empty{text-align:center;color:var(--ink3);padding:48px 20px;font-size:14.5px}
  .empty b{display:block;font-size:16px;margin-bottom:10px;color:var(--ink2);letter-spacing:.1em;font-family:var(--serif)}
  .empty-art{width:88px;height:88px;border-radius:14px;margin:0 auto 16px;display:block;
    opacity:.72;border:1px solid rgba(200,161,92,.28)}
  /* the intro and the appendix read as marginalia: a gold rule down the side,
     smaller serif text, indented from the page edge */
  details.note{
    background:linear-gradient(90deg,rgba(200,161,92,.05),rgba(30,26,22,.55) 40%);
    border:0;border-left:2px solid rgba(200,161,92,.42);border-radius:0 var(--r) var(--r) 0;
    padding:10px 14px 11px 13px;margin:0 0 16px 2px;font-size:13px;color:var(--ink2);
    font-family:var(--serif);
  }
  details.note summary{cursor:pointer;color:var(--gold2);font-weight:600;font-size:12.5px;
    letter-spacing:.1em;font-family:var(--latin);text-transform:uppercase}
  details.note summary::marker{color:rgba(200,161,92,.6)}
  details.note .body{margin-top:8px;white-space:pre-wrap;line-height:1.75}
  /* bilingual paragraph: Chinese line, then the English original below it */
  details.note .pair{margin:0 0 10px}
  details.note .pair:last-child{margin-bottom:0}
  details.note .pair .zh{color:var(--ink2);white-space:normal}
  details.note .pair .en{margin-top:3px;font-family:var(--latin);font-size:12px;line-height:1.55;
    color:var(--ink3);white-space:normal;letter-spacing:.01em}
  /* how this page was made */
  details.note .made{margin-top:12px;padding-top:10px;border-top:1px dashed rgba(200,161,92,.22);
    font-size:12px;line-height:1.7;color:var(--gold2);white-space:normal}
  .madewith{color:var(--gold2);letter-spacing:.04em}
  .apx{padding:9px 0;border-bottom:1px dashed rgba(200,161,92,.16)}
  .apx:last-child{border-bottom:0}
  .apx-zh{font-size:13.5px;color:var(--ink)}
  .apx-en{font-size:13px;color:var(--gold);margin-top:2px;word-break:break-word}
  .apx .sub{margin-top:4px}
  footer{margin:26px 14px 0;padding-top:14px;border-top:1px solid var(--line);
         color:var(--ink3);font-size:11.5px;line-height:1.7;text-align:center}
  footer a{color:var(--gold);text-decoration:none;border-bottom:1px dotted var(--line)}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);
    background:var(--card2);border:1px solid var(--line);color:var(--ink);
    padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;
    transition:.22s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (min-width:620px){
    main{max-width:680px;margin:0 auto}
    header>div, #chips{max-width:680px;margin-left:auto;margin-right:auto}
    ul{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">
      <img class="d20" src="apple-touch-icon.png" alt="">
      <div>
        <h1>仇恨之书</h1>
        <div class="sub" id="brandSub">The Big List of Racial Slurs</div>
      </div>
    </div>
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="搜索中文 / English…">
      <button id="clear" aria-label="清空">×</button>
    </div>
  </div>
  <div id="chips"></div>
</header>

<main id="main"></main>

<div id="nowbar"></div>

<footer id="foot"></footer>
<button id="top" aria-label="回到顶部">↑</button>
<div class="toast" id="toast"></div>

<script src="assets-tiny.js"></script>
<script src="assets.js"></script>
<script src="focal.js"></script>
<script src="data.js"></script>
<script>
(function(){
  var DATA = window.DND_DATA || {groups:[],appendix:[],intro:[],meta:{}};
  var $ = function(s){return document.querySelector(s)};
  var main = $('#main'), chips = $('#chips'), q = $('#q'), clearBtn = $('#clear'), foot = $('#foot');
  var FAV_KEY = 'dnd_slur_favs_v1';
  var favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch(e){}
  var active = 'all';

  function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }catch(e){} }
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 1400);
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function hl(s, term){
    s = esc(s);
    if(!term) return s;
    try{
      var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
      return s.replace(re, '<mark>$1</mark>');
    }catch(e){ return s; }
  }
  var key = function(e){ return (e.zh + '|' + e.en).toLowerCase(); };

  /* ---------- chips ---------- */
  function buildChips(){
    var html = '<button class="chip on" data-g="all">全部 ' + DATA.meta.counts.entries + '</button>';
    html += '<button class="chip" data-g="__fav">★ 收藏</button>';
    DATA.groups.forEach(function(g){
      html += '<button class="chip" data-g="' + g.key + '"><span class="ic">' + g.icon + '</span>' + esc(g.zh) + '</button>';
    });
    chips.innerHTML = html;
    chips.addEventListener('click', function(ev){
      var b = ev.target.closest('.chip'); if(!b) return;
      active = b.dataset.g;
      [...chips.querySelectorAll('.chip')].forEach(function(c){ c.classList.toggle('on', c === b); });
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  /* ---------- render ---------- */
  function render(){
    var term = q.value.trim();
    var groups = DATA.groups.slice();
    if(active === '__fav'){
      groups = groups.map(function(g){
        return Object.assign({}, g, { entries: g.entries.filter(function(e){ return favs.has(key(e)); }) });
      }).filter(function(g){ return g.entries.length; });
      if(!groups.length){ main.innerHTML = emptyBox('★','还没有收藏','点词条右侧的星标，把常用的几条钉在这里'); return; }
    }
    if(active !== 'all' && active !== '__fav') groups = groups.filter(function(g){ return g.key === active; });
    if(term){
      var t = term.toLowerCase();
      groups = groups.map(function(g){
        return Object.assign({}, g, {
          entries: g.entries.filter(function(e){
            return (e.zh && e.zh.toLowerCase().indexOf(t) >= 0) || (e.en && e.en.toLowerCase().indexOf(t) >= 0);
          })
        });
      }).filter(function(g){ return g.entries.length; });
    }

    var total = groups.reduce(function(a,g){ return a + g.entries.length; }, 0);
    if(!total){
      main.innerHTML = emptyBox('?','没有匹配的词条','换个关键词试试，中文和英文都能搜');
      return;
    }
    var html = '';
    html += introBlock(term);
    groups.forEach(function(g){
      var art = artFor(g.key);
      // the illustration becomes this group's background; the URL is attached
      // lazily by paintBanners() so 25 images are not decoded at once
      var tall = g.entries.length > 6 ? 'tall' : 'short';
      var art = artFor(g.key);
      var TINY = window.DND_TINY || {};
      html += '<section class="group" id="g-' + g.key + '" data-h="' + tall + '" data-zh="' + esc(g.zh) + '">';
      if(art){
        // stand-in paints immediately; the real picture fades in once it is decoded.
        // positioning is inline so it cannot be lost to stylesheet ordering.
        html += '<div class="gart" style="position:absolute;left:0;right:0;top:0">' +
                '<img class="tiny" src="' + esc(TINY[g.key] || art) + '" alt="">' +
                '<img class="full" data-src="' + esc(art) + '" alt=""></div>';
      }
      html += '<div class="ghead"><div class="row"><span class="ic">' + g.icon + '</span>' +
              '<span class="zh">' + esc(g.zh) + '</span></div>' +
              '<div class="meta">' + esc(g.en) + ' <b>· ' + g.entries.length + '</b></div></div><ul>';
      g.entries.forEach(function(e){
        var k = key(e), on = favs.has(k);
        html += '<li data-k="' + esc(k) + '"><div class="txt">' +
                '<div class="zh">' + hl(e.zh, term) + '</div>' +
                '<div class="en">' + hl(e.en, term) + '</div>' +
                (e.by || e.sub ? '<span class="sub">' + esc(e.by || e.sub) + '</span>' : '') +
                '</div><button class="star' + (on ? ' on' : '') + '" aria-label="收藏">' + (on ? '★' : '☆') + '</button></li>';
      });
      html += '</ul></section>';
      // a printed ornament closing each chapter (not after the last one)
      html += '<div class="fleuron">❦</div>';
    });
    if(DATA.appendix && DATA.appendix.length) html += appendixBlock(term);
    main.innerHTML = html;
    paintBanners();
  }
  /* race images: window.DND_ASSETS maps a group key to a URL (or, in the
     single-file build, to an inlined data: URL). Missing keys just fall back to
     the plain text header. */
  function artFor(k){
    var A = window.DND_ASSETS || {};
    return A[k] || null;
  }
  /* 25 full-column pictures decoded at once would cost a lot of image memory on a
     phone, so a column's artwork is only fetched when the column nears the viewport
     — the 24 px stand-in is already there, so it never looks empty. */
  function paintBanners(){
    var nodes = [].slice.call(main.querySelectorAll('.gart img.full[data-src]'));
    if(!nodes.length) return;
    var load = function(img){
      var real = img.getAttribute('data-src');
      if(!real) return;
      img.removeAttribute('data-src');
      img.onload = function(){
        img.classList.add('on');
        // decide by REAL heights, not by entry count: if the picture is about as
        // tall as the column, fill the column; if the column is much taller, let the
        // picture sit on top and the column's gradient do the fading
        var sec = img.closest ? img.closest('.group') : null;
        if(sec){
          var artH = img.naturalHeight / img.naturalWidth * sec.clientWidth;
          var tallMode = sec.clientHeight > artH * 1.12;
          sec.classList.add(tallMode ? 'art-top' : 'art-fill');
          // keep the FACE in frame when the picture is cropped to fill the column.
          // object-position y% means "image y% aligns with container y%", so place the
          // head at the container's centre: y = (head - c/2) / (1 - c)
          var head = (window.DND_FOCAL || {})[sec.id.replace(/^g-/, '')];
          if(head && !tallMode){
            // object-position y% : "image y% aligns with container y%" — put the head
            // at the container's centre:  y = (head - c/2) / (1 - c),  c = column/art
            var c = Math.min(0.95, sec.clientHeight / artH);
            var y = (head / 100 - c / 2) / (1 - c) * 100;
            img.style.objectPosition = 'center ' + Math.max(0, Math.min(100, Math.round(y))) + '%';
          }
        }
      };
      // images may come from a mirror CDN (much faster than github.io from mainland
      // China); if that copy fails, fall back to the file next to this page
      img.onerror = function(){
        if(CDN && img.src.indexOf(CDN) === 0) img.src = real;
      };
      img.src = (CDN && cdnOk) ? CDN + real : real;
    };
    if(!('IntersectionObserver' in window)){ nodes.forEach(load); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        load(en.target);
        io.unobserve(en.target);
      });
    }, { rootMargin: '400px 0px' });
    nodes.forEach(function(el){ io.observe(el); });
  }
  function emptyBox(icon, title, sub){
    return '<div class="empty"><img class="empty-art" src="apple-touch-icon.png" alt="" onerror="this.style.display=\'none\'">' +
           '<b>' + esc(title) + '</b><div style="margin-top:6px">' + esc(sub) + '</div></div>';
  }
  function introBlock(term){
    if(term || active !== 'all' || !DATA.intro || !DATA.intro.length) return '';
    // each paragraph is a ZH/EN pair: Chinese on its own line, the English original
    // underneath in smaller type (the cover is bilingual)
    var body = DATA.intro.map(function(p){
      if(p && typeof p === 'object'){
        return '<div class="pair"><div class="zh">' + esc(p.zh) + '</div>' +
               (p.en ? '<div class="en">' + esc(p.en) + '</div>' : '') + '</div>';
      }
      return '<div class="pair"><div class="zh">' + esc(p) + '</div></div>';
    }).join('');
    body += '<div class="made">该工具 100% vibecoding，由吃白饭的大肥鱼制作</div>';
    return '<details class="note"><summary>关于这份清单（原作者前言）</summary><div class="body">' +
           body + '</div></details>';
  }
  function appendixBlock(term){
    // Each appendix line holds the Chinese gloss first and the English original
    // second, separated by the "*" the source uses as a bullet. The extracted
    // text glues the two together, so split at the bullet whose tail starts with
    // latin letters (a bullet inside a quoted example never does).
    var items = DATA.appendix.map(function(a){
      var t = (a.text || '').trim();
      var zh = '', en = '';
      var m = /^\*?\s*([\s\S]*?)\s*\*\s*([A-Za-z][\s\S]*)$/.exec(t);
      if (m) { zh = m[1].trim(); en = m[2].trim(); }
      else zh = t.replace(/^\*\s*/, '');
      var block = '<div class="apx">';
      if (zh) block += '<div class="apx-zh">' + hl(zh, term) + '</div>';
      if (en) block += '<div class="apx-en">' + hl(en, term) + '</div>';
      block += '<span class="sub">' + esc(a.section) + '</span></div>';
      return block;
    }).join('');
    return '<details class="note"><summary>附录 · 间接种族侮辱与告示（' + DATA.appendix.length + '）</summary><div class="body">' + items + '</div></details>';
  }

  /* ---------- events ---------- */
  var t0 = null;
  q.addEventListener('input', function(){
    clearBtn.classList.toggle('on', !!q.value);
    clearTimeout(t0); t0 = setTimeout(render, 90);
  });
  clearBtn.addEventListener('click', function(){ q.value = ''; clearBtn.classList.remove('on'); render(); q.focus(); });
  var topBtn = $('#top');
  if(topBtn){
    topBtn.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var onScroll = function(){
      var y = (typeof window.scrollY === 'number' ? window.scrollY : 0) ||
              (document.documentElement ? document.documentElement.scrollTop : 0) || 0;
      topBtn.classList.toggle('on', y > 700);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }
  main.addEventListener('click', function(ev){
    var s = ev.target.closest('.star'); if(!s) return;
    var li = s.closest('li'), k = li.dataset.k;
    if(favs.has(k)){ favs.delete(k); s.classList.remove('on'); s.textContent = '☆'; }
    else { favs.add(k); s.classList.add('on'); s.textContent = '★'; toast('已收藏'); }
    saveFavs();
    if(active === '__fav') render();
  });

  /* ---------- init ---------- */
  // mirror probe: if the CDN copy of an image answers quickly, take the rest from
  // there (github.io is slow from some networks); otherwise stay same-origin
  var CDN = window.DND_CDN || '';
  var cdnOk = false;
  if(CDN){
    var probe = new Image(), t0 = Date.now();
    probe.onload = function(){ if(Date.now() - t0 < 2500) cdnOk = true; };
    probe.src = CDN + 'assets/dwarf.webp';
  }
  buildChips();
  render();
  // "you are here": while scrolling, name the race whose column covers the top
  var nowbar = $('#nowbar');
  if(nowbar && 'IntersectionObserver' in window){
    var nowCurrent = null, seen = {};
    var io2 = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting) seen[en.target.id] = en.boundingClientRect.top;
        else delete seen[en.target.id];
      });
      var best = null, bestTop = Infinity;
      for(var id in seen){ if(seen[id] < bestTop){ bestTop = seen[id]; best = id; } }
      var sec = best ? document.getElementById(best) : null;
      var label = sec ? sec.getAttribute('data-zh') : null;
      if(label && label !== nowCurrent){ nowCurrent = label; nowbar.textContent = label; }
      var y = (typeof window.scrollY === 'number' ? window.scrollY : 0) ||
              (document.documentElement ? document.documentElement.scrollTop : 0) || 0;
      nowbar.classList.toggle('on', !!label && y > 320);
    }, { rootMargin: '-110px 0px -55% 0px', threshold: 0 });
    var rewatch = function(){
      seen = {};
      [].slice.call(main.querySelectorAll('.group')).forEach(function(g){ io2.observe(g); });
    };
    rewatch();
    var baseRender = render;
    render = function(){ baseRender.apply(null, arguments); rewatch(); };
  }
  var m = DATA.meta || {};
  foot.innerHTML = (m.disclaimer ? esc(m.disclaimer) + '<br>' : '') +
    '共 ' + (m.counts ? m.counts.entries : 0) + ' 条 / ' + (m.counts ? m.counts.groups : 0) + ' 个种族分组' +
    (m.authorUrl ? '<br>清单来源：<a href="' + esc(m.authorUrl) + '" target="_blank" rel="noopener">' + esc(m.author || m.authorUrl) + '</a>' : '') +
    (m.authorNote ? '<br>' + esc(m.authorNote) : '') +
    '<br><span class="madewith">该工具 100% vibecoding，由吃白饭的大肥鱼制作</span>' +
    '<br>离线可用 · 可加入主屏幕 · 收藏保存在本机';
  document.title = '仇恨之书';
})();
</script>
</body>
